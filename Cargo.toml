[package]
name = "glint"
version = "0.2.0"
edition = "2024"
description = "Tiny native Windows tray app for DDC/CI monitor control (brightness, contrast, RGB, presets, game modes, input)"
repository = "https://github.com/andib0/glint"
readme = "README.md"
keywords = ["ddc", "monitor", "brightness", "windows", "tray"]
license = "MIT"

[lib]
name = "glint"
path = "src/lib.rs"

[[bin]]
name = "glint"
path = "src/bin/glint.rs"

[[bin]]
name = "glintctl"
path = "src/bin/glintctl.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
# 0.59 ships import libs; 0.60+ needs dlltool on the GNU toolchain.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_Display",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_Graphics_GdiPlus",
] }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
